# Fluent Bit (DaemonSet): собирает stdout/stderr контейнеров (access/error-логи nginx) -> Loki.
config:
  inputs: |
    [INPUT]
        Name              tail
        Path              /var/log/containers/*.log
        multiline.parser  docker, cri
        Tag               kube.*
        Mem_Buf_Limit     5MB
        Skip_Long_Lines   On
  filters: |
    [FILTER]
        Name                kubernetes
        Match               kube.*
        Merge_Log           Off
        K8S-Logging.Parser  Off
        Labels              On
        Buffer_Size         256k
        Annotations         Off
  outputs: |
    [OUTPUT]
        Name        loki
        Match       kube.*
        Host        loki.logging.svc.cluster.local
        Port        3100
        Labels      job=fluentbit
        Label_keys  $kubernetes['namespace_name'],$kubernetes['pod_name'],$kubernetes['container_name'],$kubernetes['labels']['app']
        Remove_keys kubernetes
        Line_format json
