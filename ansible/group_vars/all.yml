---
# Единое место для версий. README ссылается на этот файл.
k8s_version: "1.36"          # minor-версия Kubernetes (pkgs.k8s.io)
crio_version: "v1.36"
helm_version: "3.17.1"
cilium_version: "1.19.0"
pod_network_cidr: "10.244.0.0/16"

# Gateway API: реализация — Envoy Gateway (чарт включает Gateway API CRD).
# Закрепите версии после первого успешного прогона (helm list -A).
envoy_gateway_version: "v1.5.0"
gateway_nodeport_http: 30080

# Observability. Пусто = последняя версия чарта; для воспроизводимости зафиксируйте.
kube_prometheus_stack_version: ""
loki_chart_version: ""
fluent_bit_chart_version: ""

repo_root: "{{ playbook_dir }}/.."
