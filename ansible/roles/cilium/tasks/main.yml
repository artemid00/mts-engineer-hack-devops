---
# Cilium как CNI (kube-proxy остаётся штатным — проще и надёжнее на одном узле).
# Gateway API реализует Envoy Gateway (роль gateway_api), поэтому gatewayAPI в Cilium выключен.
# Шаги идемпотентны (helm upgrade --install).

- name: Add Cilium Helm repository
  ansible.builtin.command: helm repo add cilium https://helm.cilium.io/ --force-update
  changed_when: false

- name: Install/upgrade Cilium via Helm
  ansible.builtin.command: >
    helm upgrade --install cilium cilium/cilium
    --version {{ cilium_version }}
    --namespace kube-system
    --set ipam.mode=cluster-pool
    --set ipam.operator.clusterPoolIPv4PodCIDRList={{ pod_network_cidr }}
    --set operator.replicas=1
    --wait --timeout 5m
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf

# На первом старте поды (coredns) иногда застревают в ContainerCreating: агент Cilium не успел
# подготовить CNI. Лечится перезапуском агента, поэтому ждём coredns и при неудаче перезапускаем.
- name: Wait for CoreDNS
  ansible.builtin.command: kubectl -n kube-system rollout status deploy/coredns --timeout=120s
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  register: coredns_wait
  failed_when: false
  changed_when: false

- name: Restart Cilium agent if CoreDNS is stuck
  ansible.builtin.command: kubectl -n kube-system rollout restart ds/cilium
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  when: coredns_wait.rc != 0

- name: Recreate stuck CoreDNS pods
  ansible.builtin.command: kubectl -n kube-system delete pod -l k8s-app=kube-dns
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  when: coredns_wait.rc != 0

- name: Wait for CoreDNS after Cilium restart
  ansible.builtin.command: kubectl -n kube-system rollout status deploy/coredns --timeout=300s
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  changed_when: false
  when: coredns_wait.rc != 0

- name: Wait for node to become Ready
  ansible.builtin.command: kubectl wait --for=condition=Ready node --all --timeout=300s
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  changed_when: false
