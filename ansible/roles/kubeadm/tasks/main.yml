---
# tasks file for kubelet

- name: Install required utils
  ansible.builtin.apt:
    name:
      - curl
      - ca-certificates
      - gpg
      - apt-transport-https
      - python3-debian
    state: present
    update_cache: yes

- name: Add Kubernetes repository 
  ansible.builtin.deb822_repository:
    name: kubernetes
    types: deb
    uris: "{{ k8s_pkgs_base }}/core/stable/v{{ k8s_version }}/deb/"
    suites: "/"
    components: [""]
    signed_by: "{{ k8s_pkgs_base }}/core/stable/v{{ k8s_version }}/deb/Release.key"
    state: present

- name: Install kubeadm
  ansible.builtin.apt:
    name: "kubeadm={{ k8s_version }}*"
    state: present
    update_cache: yes

- name: Hold kubeadm version
  ansible.builtin.dpkg_selections:
    name: kubeadm
    selection: hold

