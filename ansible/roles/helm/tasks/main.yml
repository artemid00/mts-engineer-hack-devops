---
# tasks file for helm

- name: Check if Helm is installed
  ansible.builtin.command: helm version
  register: helm_installed
  failed_when: no
  changed_when: false

- name: Download and install Helm binary
  # get.helm.sh — первоисточник самого проекта Helm (тот же URL использует
  # их официальный install-скрипт get-helm-3). Не baltocdn.com: у него
  # проблема с цепочкой сертификатов, которую не проходят ни python, ни curl.
  ansible.builtin.unarchive:
    src: "https://get.helm.sh/helm-v{{ helm_version }}-linux-amd64.tar.gz"
    dest: /tmp
    remote_src: yes
  when: helm_installed.rc != 0

- name: Install Helm binary
  ansible.builtin.copy:
    src: /tmp/linux-amd64/helm
    dest: /usr/local/bin/helm
    mode: "0755"
    remote_src: yes
  when: helm_installed.rc != 0
